[project]
name = "mixly"
version = "0.2.0"
description = "Free up a full C: drive by moving tools, games, apps and folders and keeping them working"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mixly = "mixly.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mixly"]
