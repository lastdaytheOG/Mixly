name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --name mixly --paths . packaging/mixly_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: mixly
          path: dist/mixly.exe
