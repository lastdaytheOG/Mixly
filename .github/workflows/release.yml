name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --uac-admin --name mixly --paths . packaging/mixly_app.py
      - run: gh release create "$env:GITHUB_REF_NAME" dist/mixly.exe --title "Mixly $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
